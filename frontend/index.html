<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garrulus</title>
    <!-- Link previews (Open Graph, X/Twitter): every route serves this file and crawlers run no JavaScript, so these are
         the same for all pages. The images come from docs/brand; og:image must be an absolute URL. -->
    <meta name="description" content="Garrulus reads journals of biodiversity science every day and lists the scientific names it finds, placed in the Catalogue of Life." />
    <meta property="og:site_name" content="Garrulus" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Garrulus" />
    <meta property="og:description" content="Garrulus reads journals of biodiversity science every day and lists the scientific names it finds, placed in the Catalogue of Life." />
    <meta property="og:image" content="https://garrulus.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Garrulus logo: a jay's head and the word Garrulus" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://garrulus.app/og-image.png" />
    <!-- Mantine's ColorSchemeScript (defaultColorScheme "auto"), inlined as Mantine documents for Vite: the colour
         scheme attribute is set before the bundle runs, so a dark system does not flash the light page first. -->
    <script data-mantine-script>
      try {
        var _colorScheme = window.localStorage.getItem("mantine-color-scheme-value");
        var colorScheme = _colorScheme === "light" || _colorScheme === "dark" || _colorScheme === "auto" ? _colorScheme : "auto";
        var computedColorScheme = colorScheme !== "auto" ? colorScheme : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mantine-color-scheme", computedColorScheme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
