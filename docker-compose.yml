# Local helper services for Garrulus.
#
#   docker compose up -d db                   # what the apps need day to day
#
# gnfinder is not here: it runs natively in development and production (see CLAUDE.md, "gnfinder"), and only the
# integration test GnfinderClientIT runs it in docker, built from docker/gnfinder.
#   docker compose --profile grobid up -d     # + GROBID (PDF/TEI parsing)
#   docker compose --profile annotate up -d   # + Label Studio (annotation)
#   docker compose --profile mail up -d       # + Mailpit (SMTP 1025, web UI http://localhost:8025)
#
# Ports are published on 127.0.0.1 only.
# Local use only: the database credentials below are throwaway development values.
name: garrulus
services:
  db:
    image: postgres:19
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: garrulus
      POSTGRES_USER: garrulus
      POSTGRES_PASSWORD: garrulus
    volumes:
      # Postgres 18+ images keep their data in /var/lib/postgresql/<major>/docker: mount the parent. The old
      # Postgres 17 volume "nametracker_pg" is no longer used (its data dir cannot be opened by 19).
      - pg19:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garrulus -d garrulus"]
      interval: 5s
      timeout: 5s
      retries: 20

  grobid:
    image: grobid/grobid:0.9.1-crf
    profiles: [grobid]
    init: true
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:8070:8070"

  labelstudio:
    image: heartexlabs/label-studio:1.23.2
    profiles: [annotate]
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      # Optional first-run account and API token for scripted use: set them in your shell or a git-ignored .env, never here.
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN:-}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    volumes:
      - ls:/label-studio/data

  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"   # SMTP: spring.mail.host=localhost, spring.mail.port=1025
      - "127.0.0.1:8025:8025"   # web UI

volumes:
  pg19:
  ls:
    # Created under the earlier project name "nametracker": keep its annotations.
    name: nametracker_ls
