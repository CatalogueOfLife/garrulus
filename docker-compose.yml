# Local helper services for Garrulus (internal id nametracker).
#
#   docker compose up -d db gnfinder          # what the app and tests need day to day
#   docker compose --profile grobid up -d     # + GROBID (PDF/TEI parsing)
#   docker compose --profile annotate up -d   # + Label Studio (annotation)
#   docker compose --profile mail up -d       # + Mailpit (SMTP 1025, web UI http://localhost:8025)
#
# Ports are published on 127.0.0.1 only.
# Local use only: the database credentials below are throwaway development values.
name: nametracker
services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: nametracker
      POSTGRES_USER: nametracker
      POSTGRES_PASSWORD: nametracker
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nametracker -d nametracker"]
      interval: 5s
      timeout: 5s
      retries: 20

  gnfinder:
    image: gnames/gnfinder:v1.4.0   # v1.5.0 is tagged but has no image yet
    platform: linux/amd64           # v1.4.0 is published for amd64 only; runs emulated on arm64
    command: ["-p", "8999"]          # the image default, spelled out
    ports:
      - "127.0.0.1:8778:8999"

  grobid:
    image: grobid/grobid:0.9.1-crf
    profiles: [grobid]
    init: true
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:8070:8070"

  labelstudio:
    image: heartexlabs/label-studio:1.23.2
    profiles: [annotate]
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      # Optional first-run account and API token for scripted use: set them in your shell or a git-ignored .env, never here.
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN:-}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    volumes:
      - ls:/label-studio/data

  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"   # SMTP: spring.mail.host=localhost, spring.mail.port=1025
      - "127.0.0.1:8025:8025"   # web UI

volumes:
  pg:
  ls:
