spring:
  application:
    name: garrulus-finder-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

server:
  port: ${FINDER_SERVICE_PORT:8095}
  # loopback only by default; FINDER_SERVICE_ADDRESS=0.0.0.0 to serve other hosts
  address: ${FINDER_SERVICE_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

finder:
  # required: a dictionary built by `eval build-dictionary`
  dictionary: ${FINDER_DICTIONARY:}
  # blank means PipelineFactory.DEFAULT_GNFINDER_URL (http://localhost:8778)
  gnfinder-url: ${GNFINDER_URL:}
  # optional: a file with a JSON object of pipeline config overrides
  config: ${FINDER_CONFIG:}
