openapi: 3.1.0
info:
  title: Garrulus public API
  version: "0.1"
  description: >
    Read-only, unauthenticated API of Garrulus, the name-literature index of the Catalogue of Life. Only works in
    state INDEXED or NOTIFIED are listed. Errors are `{status, error}`. The `/api/taxa/**` endpoints send CORS headers
    for the COL portal origins (GET only). The admin endpoints under `/api/admin` are not part of this API.
    The account endpoints (`/api/me`, tag account) need the session cookie of a signed-in user; requests other than
    GET also need the `X-XSRF-TOKEN` header with the value of the `XSRF-TOKEN` cookie. Sign-in: `POST /api/auth/link`
    with `{"email": ...}` mails a link (always `202 {}`), and the token from that link is posted as the form parameter
    `token` to `POST /login/ott`, which answers `200 {"userId": n}` and sets the session cookie, or 401. When
    `/api/auth/config` says `orcid: true`, `/oauth2/authorization/orcid` (optionally `?prompt=login`) signs in with
    ORCID and returns to the start page, or to `/account?addEmail=1` while the account has no address. A new address
    is confirmed first: `POST /api/me/email` with `{"email": ...}` mails a link to that address (always `202 {}`), and
    the token from it is posted as `{"token": ...}` to `POST /api/auth/verify-email` from the same account's session
    (else 401; an unknown or expired token is a 400), which answers `{"outcome": "SET" | "MERGED" |
    "REFUSED_OTHER_ORCID"}`. MERGED: the address belonged to an account without ORCID iD, the two accounts are now
    one (that account's id) and the session belongs to it.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: works
  - name: names
  - name: taxa
  - name: sources
  - name: reference
  - name: account
paths:
  /api/ping:
    get:
      tags: [reference]
      summary: Health check
      operationId: ping
      responses:
        "200":
          description: The text `pong`.
          content:
            text/plain:
              schema: {type: string, examples: [pong]}
  /api/works:
    get:
      tags: [works]
      summary: Search works
      description: >
        Newest first. All filters combine with AND. `taxon` matches works that name the usage or any descendant
        outside references; with `mainSubjectOnly` only names that are the main subject of the work count.
      operationId: searchWorks
      parameters:
        - {name: taxon, in: query, description: "A usage id of the current XR.", schema: {type: string}}
        - {name: name, in: query, description: "A name id (see /api/names).", schema: {type: integer, format: int64}}
        - {name: code, in: query, description: "NomCode name, e.g. ZOOLOGICAL.", schema: {type: string}}
        - {name: taxgroup, in: query, description: "TaxGroup name (see /api/vocab/taxgroup); hierarchical.", schema: {type: string}}
        - {name: subfield, in: query, description: "A discipline code (see /api/vocab/discipline); a retired code is resolved to its replacement.", schema: {type: string}}
        - {name: discipline, in: query, description: "Alias of subfield; 400 when both are given and differ.", schema: {type: string}}
        - {name: journalType, in: query, schema: {type: string, enum: [TAXONOMIC, GENERAL]}}
        - {name: tier, in: query, schema: {type: string, enum: [CORE, BROAD, CANDIDATE, EXCLUDED]}}
        - {name: oa, in: query, schema: {type: string, enum: [DIAMOND, GOLD, HYBRID, CLOSED]}}
        - {name: country, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: integer, format: int64}}
        - {name: yearFrom, in: query, schema: {type: integer}}
        - {name: yearTo, in: query, schema: {type: integer}}
        - {name: hasActs, in: query, schema: {type: boolean}}
        - {name: actType, in: query, schema: {type: string}}
        - {name: mainSubjectOnly, in: query, schema: {type: boolean, default: false}}
        - {name: q, in: query, description: "Full-text query over title and abstract.", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
        - name: facet
          in: query
          description: Repeatable.
          schema:
            type: array
            items: {type: string, enum: [code, taxgroup, journalType, year, source, hasActs]}
          explode: true
      responses:
        "200":
          description: A page of works.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/works/{id}:
    get:
      tags: [works]
      summary: One work with its names, classifications and, if retained, its text
      operationId: getWork
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkDetail"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/names:
    get:
      tags: [names]
      summary: Find names by prefix, then by trigram similarity
      description: Prefix matches come first, each group ordered by number of works descending.
      operationId: searchNames
      parameters:
        - {name: q, in: query, required: true, description: "At least 2 characters.", schema: {type: string, minLength: 2}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        "200":
          description: Matching names.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NameHit"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/names/{id}:
    get:
      tags: [names]
      summary: A name with its match in the current XR, its timeline and first appearance
      description: The timeline counts indexed works per year that mention the name in any block, references included.
      operationId: getName
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: The name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NameFull"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/taxa/{colId}/works:
    get:
      tags: [taxa]
      summary: Works that name a taxon or a descendant
      description: >
        Same as /api/works with `taxon={colId}`, but `mainSubjectOnly` defaults to true. Same response. CORS enabled.
      operationId: taxonWorks
      parameters:
        - {name: colId, in: path, required: true, description: "A usage id of the current XR.", schema: {type: string}}
        - {name: mainSubjectOnly, in: query, schema: {type: boolean, default: true}}
        - {name: yearFrom, in: query, schema: {type: integer}}
        - {name: yearTo, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      responses:
        "200":
          description: A page of works.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/taxa/{colId}/stats:
    get:
      tags: [taxa]
      summary: Works per year of a taxon, from the nightly taxon_stats
      description: Unknown taxa and taxa without works give zero totals and no years. CORS enabled.
      operationId: taxonStats
      parameters:
        - {name: colId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The statistics.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonStats"}
  /api/sources:
    get:
      tags: [sources]
      summary: The followed journals (active CORE and BROAD sources)
      operationId: listSources
      parameters:
        - {name: q, in: query, description: "Case-insensitive title substring.", schema: {type: string}}
        - {name: tier, in: query, schema: {type: string, enum: [CORE, BROAD]}}
        - {name: journalType, in: query, schema: {type: string, enum: [TAXONOMIC, GENERAL]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      responses:
        "200":
          description: A page of sources, by title.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcePage"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/sources/{id}:
    get:
      tags: [sources]
      summary: A followed journal with its 10 most recent works
      operationId: getSource
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourceDetail"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/xr:
    get:
      tags: [reference]
      summary: The COL extended release that names are matched against
      operationId: getXr
      responses:
        "200":
          description: The pinned XR.
          content:
            application/json:
              schema:
                type: object
                required: [key, alias]
                properties:
                  key: {type: integer}
                  alias: {type: string, examples: ["COL26.10 XR"]}
        "404":
          description: No XR release is known yet (before the first XR_CHECK).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/vocab/taxgroup:
    get:
      tags: [reference]
      summary: The TaxGroup vocabulary of ChecklistBank
      operationId: taxGroups
      responses:
        "200":
          description: All groups.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TaxGroup"}
  /api/vocab/discipline:
    get:
      tags: [reference]
      summary: The discipline vocabulary of Garrulus
      description: A retired discipline names its replacement in replacedBy.
      operationId: disciplines
      responses:
        "200":
          description: All disciplines by sortOrder.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Discipline"}
  /api/auth/config:
    get:
      tags: [account]
      summary: Which sign-in methods are offered
      operationId: authConfig
      responses:
        "200":
          description: Email sign-in is always offered; ORCID only when a client is configured.
          content:
            application/json:
              schema:
                type: object
                required: [orcid]
                properties:
                  orcid: {type: boolean}
  /api/unsubscribe:
    get:
      tags: [account]
      summary: Opens the unsubscribe page of a digest link
      description: Changes nothing; redirects to the SPA page, which asks and posts the token.
      operationId: unsubscribePage
      parameters:
        - {name: t, in: query, required: false, schema: {type: string}, description: The signed token of the link.}
      responses:
        "302":
          description: Redirect to the unsubscribe page of the SPA.
    post:
      tags: [account]
      summary: Turns digests off (one-click unsubscribe, RFC 8058)
      description: No sign-in and no CSRF token; the signed token is the credential. Other settings are kept.
      operationId: unsubscribe
      parameters:
        - {name: t, in: query, required: true, schema: {type: string}, description: The signed token of the link.}
      responses:
        "200":
          description: Digests are off (also when they already were).
          content:
            application/json:
              schema: {type: object}
        "400":
          description: The token is missing or invalid.
  /api/me:
    get:
      tags: [account]
      summary: The signed-in account
      operationId: getMe
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: The account and its digest settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [account]
      summary: Change the account settings
      description: >
        Every field is optional; an absent field keeps its value and a blank displayName clears it. Turning digests
        on from OFF restarts them: hits found before are never mailed. Needs the X-XSRF-TOKEN header.
      operationId: updateMe
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: {type: [string, "null"], maxLength: 200}
                timeZone: {type: [string, "null"], description: "An IANA time zone, e.g. Europe/Berlin."}
                digestFrequency: {type: [string, "null"], enum: [DAILY, WEEKLY, OFF, null]}
                digestWeekday: {type: [integer, "null"], minimum: 1, maximum: 7, description: "1 is Monday."}
                digestHour: {type: [integer, "null"], minimum: 0, maximum: 23, description: "Local hour."}
      responses:
        "200":
          description: The changed account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: The X-XSRF-TOKEN header is missing or wrong.
    delete:
      tags: [account]
      summary: Delete the account
      description: >
        Hard delete of the account, its subscriptions, hits, digests and all its sessions. Needs the X-XSRF-TOKEN
        header.
      operationId: deleteMe
      security: [{cookieAuth: []}]
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/subscriptions:
    get:
      tags: [account]
      summary: The signed-in user's subscriptions
      operationId: listSubscriptions
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Subscription"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [account]
      summary: Follow a taxon, journal, name or taxon group
      description: >
        type is TAXON (target: a COL taxon id of 1 to 50 characters), SOURCE (a source id), NAME (a name_string id) or
        TAXGROUP (a TaxGroup name). Omitted options take the defaults of the type: mainSubjectOnly true for TAXON and
        TAXGROUP, false for NAME and SOURCE; newNamesOnly false; includeAbstractOnly true; includeReferences false.
        filters takes single values for code, taxgroup, subfield, journalType, tier, oa and country. sinceYear (1750 to
        this year) starts the alerts in that year; without it the rolling window of the last 90 days applies. At most
        100 subscriptions per user (409 {error: limit}); a second one for the same type and target is 409
        {error: exists, id}. Needs the X-XSRF-TOKEN header.
        Also, not listed as paths because the file documents GET paths: `PATCH /api/me/subscriptions/{id}` (label,
        options, filters, sinceYear (null clears it), paused; type and target cannot change), `DELETE` of the same
        path (hits go with it) and `POST /api/me/subscriptions/{id}/feed-token` (a new token; the old feed URL then
        gives 404). Another user's id is 404.
      operationId: createSubscription
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionRequest"}
      responses:
        "201":
          description: The subscription, with its feed URL.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subscription"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: The limit of 100 is reached (error limit), or the subscription exists (error exists, with id).
  /api/me/hits:
    get:
      tags: [account]
      summary: The signed-in user's hits, newest first
      operationId: listMyHits
      security: [{cookieAuth: []}]
      parameters:
        - {name: subscription, in: query, schema: {type: integer, format: int64}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      responses:
        "200":
          description: A page of hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit: {type: integer}
                  offset: {type: integer}
                  results:
                    type: array
                    items: {$ref: "#/components/schemas/MyHit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/me/export:
    get:
      tags: [account]
      summary: Everything held about the account
      description: The account row, subscriptions (feed tokens included), hits and digests, as a JSON download.
      operationId: exportMe
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {type: object}
                  subscriptions: {type: array, items: {type: object}}
                  hits: {type: array, items: {type: object}}
                  digests: {type: array, items: {type: object}}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  responses:
    Unauthorized:
      description: Not signed in.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadRequest:
      description: An invalid parameter.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Unknown, or not public.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Me:
      type: object
      required: [id, timeZone, digestFrequency, digestWeekday, digestHour, created, admin]
      properties:
        id: {type: integer, format: int64}
        email: {type: [string, "null"], description: "Verified address; null until one is verified."}
        emailVerified: {type: [string, "null"], format: date-time}
        orcid: {type: [string, "null"]}
        displayName: {type: [string, "null"]}
        timeZone: {type: string}
        digestFrequency: {type: string, enum: [DAILY, WEEKLY, OFF]}
        digestWeekday: {type: integer, description: "1 is Monday."}
        digestHour: {type: integer}
        created:
          type: string
          format: date-time
          description: "When the account was created. The web app proposes the browser's time zone once to an account
            created in the last few minutes that is still on UTC."
        admin:
          type: boolean
          description: "True when this session may use the admin endpoints: signed in through ORCID with an iD on
            the admin list."
    Error:
      type: object
      required: [status, error]
      properties:
        status: {type: integer}
        error: {type: string}
    TaxonRef:
      type: object
      properties:
        id: {type: [string, "null"]}
        name: {type: [string, "null"]}
        rank: {type: [string, "null"]}
    SourceRef:
      type: object
      required: [id, title]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
    NameRef:
      type: object
      required: [id, name, placementMethod, actTypes]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        placementMethod: {type: string, enum: [MATCH, GENUS, VERBATIM_CONTEXT, NONE]}
        usageId: {type: [string, "null"]}
        kind: {type: [string, "null"]}
        rank: {type: [string, "null"]}
        usageRank: {type: [string, "null"]}
        actTypes: {type: array, items: {type: string}}
    SubscriptionRequest:
      type: object
      properties:
        type: {type: string, enum: [TAXON, SOURCE, NAME, TAXGROUP], description: "Create only."}
        target: {type: string, description: "Create only."}
        label: {type: string, minLength: 1, maxLength: 200}
        mainSubjectOnly: {type: boolean}
        newNamesOnly: {type: boolean}
        includeAbstractOnly: {type: boolean}
        includeReferences: {type: boolean}
        filters: {$ref: "#/components/schemas/SubscriptionFilters"}
        sinceYear: {type: [integer, "null"], minimum: 1750}
        paused: {type: boolean, description: "Change only."}
    SubscriptionFilters:
      type: object
      additionalProperties: false
      properties:
        code: {type: string}
        taxgroup: {type: string}
        subfield: {type: string}
        journalType: {type: string}
        tier: {type: string}
        oa: {type: string}
        country: {type: string}
    Subscription:
      type: object
      properties:
        id: {type: integer, format: int64}
        type: {type: string, enum: [TAXON, SOURCE, NAME, TAXGROUP]}
        target: {type: string}
        label: {type: string}
        mainSubjectOnly: {type: boolean}
        newNamesOnly: {type: boolean}
        includeAbstractOnly: {type: boolean}
        includeReferences: {type: boolean}
        filters: {$ref: "#/components/schemas/SubscriptionFilters"}
        sinceYear: {type: [integer, "null"]}
        paused: {type: boolean}
        feedUrl: {type: string, description: "Secret Atom feed URL of this subscription."}
        created: {type: string, format: date-time}
    MyHit:
      type: object
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [ARTICLE, NEW_NAMES]}
        names: {type: array, items: {type: object}}
        subscriptionId: {type: integer, format: int64}
        subscriptionLabel: {type: [string, "null"]}
        created: {type: string, format: date-time}
        work:
          oneOf:
            - {$ref: "#/components/schemas/WorkSummary"}
            - {type: "null"}
    WorkSummary:
      type: object
      description: authors holds at most 3 names, mainNames at most 5.
      required: [id, authors, authorCount, hasActs, mainNames, titleMentions]
      properties:
        id: {type: integer, format: int64}
        doi: {type: [string, "null"]}
        title: {type: [string, "null"]}
        year: {type: [integer, "null"]}
        publicationDate: {type: [string, "null"], format: date}
        source: {oneOf: [{$ref: "#/components/schemas/SourceRef"}, {type: "null"}]}
        authors: {type: array, items: {type: string}}
        authorCount: {type: integer}
        textLevel: {type: [string, "null"], enum: [FULLTEXT, ABSTRACT_ONLY, NO_TEXT, null]}
        hasActs: {type: boolean}
        mainNames: {type: array, items: {$ref: "#/components/schemas/NameRef"}}
        volume: {type: [string, "null"]}
        issue: {type: [string, "null"]}
        pages: {type: [string, "null"]}
        titleMentions:
          type: array
          description: Name spans in title, as code-point offsets into it.
          items: {$ref: "#/components/schemas/MentionSpan"}
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: {type: string}
        count: {type: integer, format: int64}
    WorkPage:
      type: object
      required: [total, limit, offset, results, facets]
      properties:
        total: {type: integer, format: int64}
        limit: {type: integer}
        offset: {type: integer}
        results: {type: array, items: {$ref: "#/components/schemas/WorkSummary"}}
        facets:
          type: object
          description: The requested facets, each the 100 most frequent values.
          additionalProperties:
            type: array
            items: {$ref: "#/components/schemas/FacetCount"}
    Author:
      type: object
      required: [name]
      properties:
        name: {type: string}
        orcid: {type: [string, "null"]}
    NameDetail:
      type: object
      required: [id, name, kind, placementMethod, salience, mainSubject, onlyReference, mentionCount, actTypes, bestSnippet, classification]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        kind: {type: string}
        rank: {type: [string, "null"]}
        placementMethod: {type: string}
        usageId: {type: [string, "null"]}
        usageName: {type: [string, "null"]}
        usageRank: {type: [string, "null"]}
        usageStatus: {type: [string, "null"]}
        code: {type: [string, "null"]}
        taxgroup: {type: [string, "null"]}
        salience: {type: number}
        mainSubject: {type: boolean}
        onlyReference: {type: boolean}
        mentionCount: {type: integer}
        actTypes: {type: array, items: {type: string}}
        bestSnippet: {type: string}
        classification: {type: array, items: {$ref: "#/components/schemas/TaxonRef"}}
    MentionSpan:
      type: object
      description: startCp and endCp (exclusive) are code-point offsets into the block text.
      required: [id, nameId, startCp, endCp, verbatim]
      properties:
        id: {type: integer, format: int64}
        nameId: {type: integer, format: int64}
        startCp: {type: integer}
        endCp: {type: integer}
        verbatim: {type: string}
        actType: {type: [string, "null"]}
    TextBlock:
      type: object
      required: [id, type, level, sectionPath, text, mentions, acts]
      properties:
        id: {type: string}
        type: {type: string}
        level: {type: integer}
        sectionPath: {type: array, items: {type: string}}
        text: {type: string}
        mentions: {type: array, items: {$ref: "#/components/schemas/MentionSpan"}}
        acts: {type: array, items: {$ref: "#/components/schemas/ActSpan"}}
    ActSpan:
      type: object
      description: >-
        A nomenclatural act marker ("sp. nov.") in a text, belonging to the name span mentionId; startCp and endCp
        (exclusive) are code-point offsets into the same text as that span.
      required: [mentionId, startCp, endCp, actType]
      properties:
        mentionId: {type: integer, format: int64}
        startCp: {type: integer}
        endCp: {type: integer}
        actType: {type: string}
    Context:
      type: object
      description: >-
        A verbatim classification of the article (verbatim at most 200 code points); ranks lists its ranked names,
        highest first.
      required: [localId, verbatim, ranks, scope, blockId]
      properties:
        localId: {type: string}
        verbatim: {type: string}
        ranks:
          type: array
          items:
            type: object
            required: [rank, name]
            properties:
              rank: {type: string, description: "Upper case, e.g. ORDER, FAMILY."}
              name: {type: string}
        scope: {type: string}
        blockId: {type: string}
        untilBlockId: {type: [string, "null"]}
    WorkDetail:
      type: object
      description: text is null unless the work has a retained full-text document; snippets is empty when text is served.
      required: [id, authors, retained, hasActs, codes, taxgroups, names, contexts, titleMentions, abstractMentions, abstractActs, snippets]
      properties:
        id: {type: integer, format: int64}
        doi: {type: [string, "null"]}
        title: {type: [string, "null"]}
        year: {type: [integer, "null"]}
        publicationDate: {type: [string, "null"], format: date}
        source: {oneOf: [{$ref: "#/components/schemas/SourceRef"}, {type: "null"}]}
        authors: {type: array, items: {$ref: "#/components/schemas/Author"}}
        volume: {type: [string, "null"]}
        issue: {type: [string, "null"]}
        pages: {type: [string, "null"]}
        language: {type: [string, "null"]}
        type: {type: [string, "null"]}
        oaStatus: {type: [string, "null"]}
        bestOaUrl: {type: [string, "null"]}
        abstract: {type: [string, "null"], description: "The Crossref JATS abstract as plain text, else the OpenAlex abstract; paragraphs are separated by a blank line."}
        licence: {type: [string, "null"]}
        retained: {type: boolean}
        textLevel: {type: [string, "null"]}
        hasActs: {type: boolean}
        codes: {type: array, items: {type: string}}
        taxgroups: {type: array, items: {type: string}}
        names: {type: array, items: {$ref: "#/components/schemas/NameDetail"}}
        contexts: {type: array, items: {$ref: "#/components/schemas/Context"}}
        text:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/TextBlock"}
        titleMentions:
          type: array
          description: Name spans in title, as code-point offsets into it.
          items: {$ref: "#/components/schemas/MentionSpan"}
        abstractMentions:
          type: array
          description: Name spans in abstract, as code-point offsets into it (mentions not found in it are left out).
          items: {$ref: "#/components/schemas/MentionSpan"}
        abstractActs:
          type: array
          description: The act markers of abstractMentions, as code-point offsets into abstract.
          items: {$ref: "#/components/schemas/ActSpan"}
        snippets:
          type: array
          description: >-
            One bit of the body text per name that occurs there (never the title, abstract or references), in the order of
            names; empty when text is served.
          items: {$ref: "#/components/schemas/Snippet"}
    Snippet:
      type: object
      description: The text around the first body mention of a name; mentions mark it, as code-point offsets into text.
      required: [nameId, blockType, text, mentions, acts]
      properties:
        nameId: {type: integer, format: int64}
        blockType: {type: string}
        text: {type: string}
        mentions: {type: array, items: {$ref: "#/components/schemas/MentionSpan"}}
        acts: {type: array, items: {$ref: "#/components/schemas/ActSpan"}}
    NameHit:
      type: object
      required: [id, name, kind, works]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        kind: {type: string}
        rank: {type: [string, "null"]}
        works: {type: integer, format: int64, description: "Indexed works that mention the name."}
    NameFull:
      type: object
      required: [id, name, kind, timeline]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        kind: {type: string}
        rank: {type: [string, "null"]}
        match:
          description: >-
            The match in the current XR, null if there is none. A name is matched once per set of context hints and
            authorship; this is the match of the usage the name is placed on most often (for a placement on its genus,
            the genus), else its match without hints, else any match with a usage.
          oneOf:
            - type: object
              required: [classification]
              properties:
                usageId: {type: [string, "null"]}
                usageName: {type: [string, "null"]}
                rank: {type: [string, "null"]}
                status: {type: [string, "null"]}
                acceptedId: {type: [string, "null"]}
                classification: {type: array, items: {$ref: "#/components/schemas/TaxonRef"}}
            - type: "null"
        timeline:
          type: array
          items:
            type: object
            required: [year, works]
            properties:
              year: {type: integer}
              works: {type: integer, format: int64}
        firstAppearance:
          oneOf:
            - type: object
              required: [workId]
              properties:
                workId: {type: integer, format: int64}
                title: {type: [string, "null"]}
                publicationDate: {type: [string, "null"], format: date}
            - type: "null"
    TaxonStats:
      type: object
      required: [taxonId, total, mainSubjectTotal, years]
      properties:
        taxonId: {type: string}
        total: {type: integer, format: int64}
        mainSubjectTotal: {type: integer, format: int64}
        years:
          type: array
          items:
            type: object
            required: [year, works, mainSubjectWorks]
            properties:
              year: {type: integer}
              works: {type: integer}
              mainSubjectWorks: {type: integer}
    SourceItem:
      type: object
      required: [id, title, tier, subfields, taxgroups, codes]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        publisher: {type: [string, "null"]}
        tier: {type: string, enum: [CORE, BROAD]}
        journalType: {type: [string, "null"], enum: [TAXONOMIC, GENERAL, null]}
        primarySubfield: {type: [string, "null"]}
        subfields: {type: array, items: {type: string}}
        taxgroups: {type: array, items: {type: string}}
        codes: {type: array, items: {type: string}}
        oaModel: {type: [string, "null"], enum: [DIAMOND, GOLD, HYBRID, CLOSED, null]}
        country: {type: [string, "null"]}
        nameDensity: {type: [number, "null"]}
        actRate: {type: [number, "null"]}
        worksPerYear: {type: [integer, "null"]}
    SourcePage:
      type: object
      required: [total, limit, offset, results]
      properties:
        total: {type: integer, format: int64}
        limit: {type: integer}
        offset: {type: integer}
        results: {type: array, items: {$ref: "#/components/schemas/SourceItem"}}
    SourceDetail:
      allOf:
        - {$ref: "#/components/schemas/SourceItem"}
        - type: object
          required: [years, recentWorks]
          properties:
            issnL: {type: [string, "null"]}
            years:
              type: array
              description: Listed works per publication year, ascending, all years (not capped); works without a year are left out.
              items:
                type: object
                required: [year, works]
                properties:
                  year: {type: integer}
                  works: {type: integer, format: int64}
            taxgroupShares: {type: [object, "null"], additionalProperties: {type: number}}
            recentWorks: {type: array, items: {$ref: "#/components/schemas/WorkSummary"}}
    Discipline:
      type: object
      required: [code, label, sortOrder]
      properties:
        code: {type: string}
        label: {type: string}
        parent: {type: [string, "null"]}
        replacedBy: {type: [string, "null"]}
        sortOrder: {type: integer}
    TaxGroup:
      type: object
      required: [name, parents, codes, icon]
      properties:
        name: {type: string}
        parents: {type: array, items: {type: string}}
        codes: {type: array, items: {type: string}}
        icon: {type: string, format: uri}
