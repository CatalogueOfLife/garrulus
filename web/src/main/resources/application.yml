spring:
  application:
    name: garrulus-web
  datasource:
    url: ${NAMETRACKER_DB_URL:jdbc:postgresql://localhost:5434/nametracker}
    username: ${NAMETRACKER_DB_USER:nametracker}
    password: ${NAMETRACKER_DB_PASSWORD:nametracker}
  config:
    # local .env (see .env.example); the second entry covers running from a module directory (spring-boot:run)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  flyway:
    # the indexer owns migrations; web only validates: SchemaCheck replaces the migration strategy and never migrates
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:future"
  session:
    # Spring Session JDBC; its tables come from the V7 migration, never from framework auto-init
    timeout: 30d
    jdbc:
      initialize-schema: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  # loopback only, like the indexer; 0.0.0.0 to serve other hosts (behind a proxy)
  address: ${NAMETRACKER_WEB_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # about 30 days, so a session survives a browser restart
        max-age: 30d
        # true behind HTTPS (production); also applies to the XSRF-TOKEN cookie
        secure: ${NAMETRACKER_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

nametracker:
  # base URL of the SPA, for links in emails and feeds
  public-url: ${NAMETRACKER_PUBLIC_URL:http://localhost:5173}
  mail:
    # outgoing mail needs spring.mail.host (and port, credentials); without it mails are logged as suppressed
    from: ${NAMETRACKER_MAIL_FROM:Garrulus <noreply@localhost>}
  # signs unsubscribe links; blank = a random key per start (one WARN), so links stop working after a restart
  signing-key: ${NAMETRACKER_SIGNING_KEY:}
  digest:
    # hourly email digests (UTC, six fields); "-" switches them off
    cron: ${NAMETRACKER_DIGEST_CRON:0 5 * * * *}
  feeds:
    # public feeds list papers published in the last window-days days (shared with the indexer's alert window)
    window-days: ${NAMETRACKER_HIT_WINDOW_DAYS:90}
  orcid:
    # ORCID sign-in is offered only when a client id is set
    client-id: ${ORCID_CLIENT_ID:}
    client-secret: ${ORCID_CLIENT_SECRET:}
    base-url: ${ORCID_BASE_URL:https://orcid.org}
  admin:
    # blank = the admin endpoint does not exist. Temporary until ORCID admin roles (M4).
    token: ${ADMIN_TOKEN:}
  blobs:
    dir: ${NAMETRACKER_BLOBS_DIR:./data/blobs}
  web:
    # origins allowed to call /api/taxa/** from a browser (comma-separated)
    cors-origins: ${NAMETRACKER_WEB_CORS_ORIGINS:https://www.catalogueoflife.org,https://dev.catalogueoflife.org,https://preview.catalogueoflife.org}
