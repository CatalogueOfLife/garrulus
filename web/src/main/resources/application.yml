spring:
  application:
    name: garrulus-web
  datasource:
    url: ${GARRULUS_DB_URL:jdbc:postgresql://localhost:5434/garrulus}
    username: ${GARRULUS_DB_USER:garrulus}
    password: ${GARRULUS_DB_PASSWORD:garrulus}
  config:
    # local .env (see .env.example); the second entry covers running from a module directory (spring-boot:run)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  flyway:
    # the indexer owns migrations; web only validates: SchemaCheck replaces the migration strategy and never migrates
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:future"
  mail:
    properties:
      # JavaMail waits forever by default; a stalled SMTP host must not block the digest job (milliseconds)
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 30000
      mail.smtp.writetimeout: 30000
  session:
    # Spring Session JDBC; its tables come from the V7 migration, never from framework auto-init
    timeout: 30d
    jdbc:
      initialize-schema: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  # loopback only, like the indexer; 0.0.0.0 to serve other hosts (behind a proxy)
  address: ${GARRULUS_WEB_ADDRESS:127.0.0.1}
  # Behind Apache: X-Forwarded-Proto/-For from a local proxy are honoured, so the ORCID redirect URI ({baseUrl}) is
  # https and the sign-in limits see the client's address instead of the proxy's
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # about 30 days, so a session survives a browser restart
        max-age: 30d
        # true behind HTTPS (production); also applies to the XSRF-TOKEN cookie
        secure: ${GARRULUS_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

garrulus:
  # base URL of the SPA, for links in emails and feeds
  public-url: ${GARRULUS_PUBLIC_URL:http://localhost:5173}
  mail:
    # outgoing mail needs spring.mail.host (and port, credentials); without it mails are logged as suppressed
    from: ${GARRULUS_MAIL_FROM:Garrulus <noreply@localhost>}
  # signs unsubscribe links; blank = a random key per start (one WARN), so links stop working after a restart
  signing-key: ${GARRULUS_SIGNING_KEY:}
  digest:
    # hourly email digests (UTC, six fields); "-" switches them off
    cron: ${GARRULUS_DIGEST_CRON:0 5 * * * *}
  feeds:
    # public feeds list papers published in the last window-days days (shared with the indexer's alert window)
    window-days: ${GARRULUS_HIT_WINDOW_DAYS:90}
  orcid:
    # ORCID sign-in is offered only when a client id is set
    client-id: ${ORCID_CLIENT_ID:}
    client-secret: ${ORCID_CLIENT_SECRET:}
    base-url: ${ORCID_BASE_URL:https://orcid.org}
  admin:
    # the X-Admin-Token header for scripts; blank = no token access
    token: ${ADMIN_TOKEN:}
    # ORCID iDs (comma-separated) whose ORCID sign-in makes an admin; read at start. Without token and iDs the admin
    # endpoints do not exist (404).
    orcids: ${GARRULUS_ADMIN_ORCIDS:}
    # mails the admin notices of the indexer (layer failing/recovered, route restart cap) to the admins' verified
    # addresses (UTC, six fields); "-" switches it off
    mail-cron: ${GARRULUS_ADMIN_MAIL_CRON:0 */5 * * * *}
  registrations:
    # the users' mails about accepted or declined registered journals (UTC, six fields); "-" switches them off
    mail-cron: ${GARRULUS_REGISTRATIONS_MAIL_CRON:0 */5 * * * *}
    # the daily admin notice when registered journals wait for a decision (UTC); "-" switches it off
    admin-note-cron: ${GARRULUS_REGISTRATIONS_ADMIN_NOTE_CRON:0 0 7 * * *}
  blobs:
    dir: ${GARRULUS_BLOBS_DIR:./data/blobs}
  web:
    # origins allowed to call /api/taxa/** from a browser (comma-separated)
    cors-origins: ${GARRULUS_WEB_CORS_ORIGINS:https://www.catalogueoflife.org,https://dev.catalogueoflife.org,https://preview.catalogueoflife.org}
