function DrawImage(ImgD,FitWidth,FitHeight){
	var image=new Image();
	image.src=ImgD.src;
	if(image.width>0 && image.height>0){
		if(image.width/image.height>= FitWidth/FitHeight){
			if(image.width>FitWidth){
				ImgD.width=FitWidth;
				ImgD.height=(image.height*FitWidth)/image.width;
			}else{
				ImgD.width=image.width;
				ImgD.height=image.height;
			}
		} else{
			if(image.height>FitHeight){
				ImgD.height=FitHeight;
				ImgD.width=(image.width*FitHeight)/image.height;
			}else{
				ImgD.width=image.width;
				ImgD.height=image.height;
			}
		}
	}
}

jQuery(function() {
	jQuery.ajax({
		url: "https://www.biodiversity-science.net/EN/user/validateCollectArticle.do?articleId=93333",
		success: function(res) {
			collectCount();
			if (res == "true") {
				jQuery("#collectArticle").append("This article has been collected");
			}
			if (res == "false") {
				jQuery("#collectArticle").append("<a href='javascript:;' onclick=\"collectArticle('93333')\">Save</a>");
			}
		}
	});
});

function collectCount() {
	jQuery.ajax({
		url: "https://www.biodiversity-science.net/CN/user/articleCollectionTimes.do?articleId=93333",
		success: function(res) {
			jQuery("#collectCount").html("");
			jQuery("#collectCount").append(res);
		}
	});
}

function collectArticle(id) {
	var url = window.location.href;
	jQuery.ajax({
		url: "https://www.biodiversity-science.net/EN/user/addCollectArticle.do",
		data: {
			"articleId": id,
			"url": url
		},
		type: "post",
		success: function(res) {
			if (res == "true") {
				document.getElementById("collectArticle").innerHTML = "This article has been collected!";
				collectCount();
				alert("Sucess to collect!");
			} else if (res == "false") {
				alert("This article has been collected!");
				window.location.reload();
			} else if (res.length > 5) {
				window.location.href = "https://www.biodiversity-science.net/EN/user/userInfo_en.jsp?url=" + res;
			} else {
				alert("Fail to collect this article!");
				window.location.reload();
			}
		},
		error: function() {
			alert("Fail to collect this article!");
		}
	});
}

function findPassword(email){
	var emailReg = /^([a-zA-Z0-9_-])+@([a-zA-Z0-9_-])+(.[a-zA-Z0-9_-])+/
	var email = document.getElementById(email).value;
	var matchemail = emailReg.test(email);
	var pars = "email="+email;
	if(email == '' || email == null){
		alert("Email不能为空！");
		return false;
	} else {
		if(matchemail){
			jQuery.post("https://www.biodiversity-science.net/EN/user/findPassword.do?" + new Date(), pars, function(data){
				subwin.close();
			});
		}else{
			alert("Email格式不正确");		
		}
	}
}
