spring:
  application:
    name: garrulus-indexer
  datasource:
    url: ${NAMETRACKER_DB_URL:jdbc:postgresql://localhost:5434/nametracker}
    username: ${NAMETRACKER_DB_USER:nametracker}
    password: ${NAMETRACKER_DB_PASSWORD:nametracker}
  config:
    # local .env (see .env.example); the second entry covers running from a module directory (spring-boot:run).
    # nametracker.dotenv replaces the list; the ITs set it to a file that never exists, so they never read a .env
    import: ${nametracker.dotenv:optional:file:.env[.properties],optional:file:../.env[.properties]}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${NAMETRACKER_INDEXER_PORT:8081}
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info

nametracker:
  indexer:
    workers: ${NAMETRACKER_INDEXER_WORKERS:8}
    poll-interval: ${NAMETRACKER_INDEXER_POLL_INTERVAL:2s}
    max-attempts: ${NAMETRACKER_INDEXER_MAX_ATTEMPTS:5}
    backoff: ${NAMETRACKER_INDEXER_BACKOFF:1m}
    # a RUNNING task whose lock is older than stale-after is requeued; the heartbeat keeps live tasks fresh
    stale-after: ${NAMETRACKER_INDEXER_STALE_AFTER:1h}
    requeue-interval: ${NAMETRACKER_INDEXER_REQUEUE_INTERVAL:10m}
    heartbeat-interval: ${NAMETRACKER_INDEXER_HEARTBEAT_INTERVAL:2m}

  stats:
    # nightly REBUILD_STATS (name ubiquity, taxon stats; LIVE priority); UTC, six fields; not behind the harvest switch
    cron: ${NAMETRACKER_STATS_CRON:0 30 4 * * *}

  harvest:
    # master switch of the scheduled harvests; off means nothing is enqueued on a schedule (handlers still run for
    # tasks enqueued by hand). Crons are UTC, six fields.
    enabled: ${NAMETRACKER_HARVEST_ENABLED:false}
    openalex-cron: ${NAMETRACKER_HARVEST_OPENALEX_CRON:0 0 2 * * *}
    sweep-cron: ${NAMETRACKER_HARVEST_SWEEP_CRON:0 0 4 * * SUN}
    crossref-cron: ${NAMETRACKER_HARVEST_CROSSREF_CRON:0 0 3 * * *}
    # a harvest or onboarding page that meets an outage (a retryable HTTP failure) is enqueued again after this delay
    outage-delay: ${NAMETRACKER_HARVEST_OUTAGE_DELAY:30m}

  layers:
    # nightly route rollout: onboarding passes of VERIFIED routes, a few a night (behind the harvest switch)
    rollout-cron: ${NAMETRACKER_LAYERS_ROLLOUT_CRON:0 30 0 * * *}
    rollout-per-night: ${NAMETRACKER_LAYERS_ROLLOUT_PER_NIGHT:20}
    # daily live harvests per layer, behind the harvest switch and the layer's own switch (default on); UTC
    oai-cron: ${NAMETRACKER_LAYERS_OAI_CRON:0 30 4 * * *}
    magtech-cron: ${NAMETRACKER_LAYERS_MAGTECH_CRON:0 45 4 * * *}
    europepmc-cron: ${NAMETRACKER_LAYERS_EUROPEPMC_CRON:0 0 5 * * *}
    blr-cron: ${NAMETRACKER_LAYERS_BLR_CRON:0 15 5 * * *}
    # nightly COVERAGE_CHECK of yesterday (layer health, coverage); analysis, not behind the harvest switch
    coverage-cron: ${NAMETRACKER_LAYERS_COVERAGE_CRON:0 30 6 * * *}
    oai.enabled: ${NAMETRACKER_LAYERS_OAI_ENABLED:true}
    # an ONBOARDING/BACKFILL OAI pass that loses its resumption token again restarts a day later at most this many
    # times; the next loss makes the route BROKEN and writes an admin notice
    oai.max-long-restarts: ${NAMETRACKER_LAYERS_OAI_MAX_LONG_RESTARTS:3}
    magtech.enabled: ${NAMETRACKER_LAYERS_MAGTECH_ENABLED:true}
    europepmc.enabled: ${NAMETRACKER_LAYERS_EUROPEPMC_ENABLED:true}
    blr.enabled: ${NAMETRACKER_LAYERS_BLR_ENABLED:true}

  # base URL of the SPA, for the links in admin notices
  public-url: ${NAMETRACKER_PUBLIC_URL:http://localhost:5173}

  coverage:
    # layer health: FAILING at this many failed or zero-yield days in a row; DEGRADED under yield-ratio of the weekly
    # median, or with a miss share over miss-share where the baseline was under miss-baseline
    # (failed run days: fail-days; zero-yield days: zero-fail-days, counted only on days with a DONE run whose expected
    # yield, the median of that weekday over 8 weeks, is at least zero-yield-min-expected); the yield-ratio rule
    # applies only from a weekly median of yield-min-median. Start values, tuned after a month.
    fail-days: ${NAMETRACKER_COVERAGE_FAIL_DAYS:2}
    zero-fail-days: ${NAMETRACKER_COVERAGE_ZERO_FAIL_DAYS:3}
    zero-yield-min-expected: ${NAMETRACKER_COVERAGE_ZERO_YIELD_MIN_EXPECTED:3.0}
    yield-min-median: ${NAMETRACKER_COVERAGE_YIELD_MIN_MEDIAN:14}
    yield-ratio: ${NAMETRACKER_COVERAGE_YIELD_RATIO:0.5}
    miss-share: ${NAMETRACKER_COVERAGE_MISS_SHARE:0.30}
    miss-baseline: ${NAMETRACKER_COVERAGE_MISS_BASELINE:0.10}

  openalex:
    base-url: ${NAMETRACKER_OPENALEX_BASE_URL:https://api.openalex.org}
    # from the environment or the git-ignored .env; blank means no key (keyless page paging)
    api-key: ${OPENALEX_API_KEY:}
    max-daily-usd: ${NAMETRACKER_OPENALEX_MAX_DAILY_USD:1.00}
    content:
      # content.openalex.org, GROBID TEI at $0.01 per download; needs the API key
      base-url: ${NAMETRACKER_OPENALEX_CONTENT_BASE_URL:https://content.openalex.org}
      enabled: ${NAMETRACKER_OPENALEX_CONTENT_ENABLED:true}
      reserve-usd: ${NAMETRACKER_OPENALEX_CONTENT_RESERVE_USD:0.30}
  snapshot:
    # the free OpenAlex snapshot (BACKFILL, BACKFILL_FILE): manifest at <base-url>/data/jsonl/manifest.json, its
    # s3://openalex/<path> file urls read as <base-url>/<path>
    base-url: ${NAMETRACKER_SNAPSHOT_BASE_URL:https://openalex.s3.amazonaws.com}
    # a works file that delivers no byte for this long counts as broken off (the task fails and reads it again)
    read-timeout: ${NAMETRACKER_SNAPSHOT_READ_TIMEOUT:5m}
  # per-host request spacing overrides: nametracker.http.min-interval.<host>=<duration>, e.g. api.crossref.org=500ms
  seed:
    core-min-works: ${NAMETRACKER_SEED_CORE_MIN_WORKS:20}
    core-min-share: ${NAMETRACKER_SEED_CORE_MIN_SHARE:0.30}
    broad-min-works: ${NAMETRACKER_SEED_BROAD_MIN_WORKS:30}
    broad-min-share: ${NAMETRACKER_SEED_BROAD_MIN_SHARE:0.50}
    candidate-min-works: ${NAMETRACKER_SEED_CANDIDATE_MIN_WORKS:10}
    # OpenAlex topic ids (comma-separated) whose works make a journal taxonomic; blank = the 17 built-in ones
    taxonomy-topics: ${NAMETRACKER_SEED_TAXONOMY_TOPICS:T14399,T11494,T12132,T12606,T11974,T12447,T13269,T12361,T12568,T14049,T11836,T11528,T12668,T11879,T11354,T10332,T12319}
  discovery:
    issnl:
      # REFRESH_ISSNL: the ISSN to ISSN-L table of the ISSN International Centre. Off by default until the (undocumented)
      # zip URL is cleared for use; the candidate registry then matches by plain ISSN only.
      enabled: ${NAMETRACKER_DISCOVERY_ISSNL_ENABLED:false}
      url: ${NAMETRACKER_DISCOVERY_ISSNL_URL:https://www.issn.org/wp-content/uploads/2014/03/issnltables.zip}
      read-timeout: ${NAMETRACKER_DISCOVERY_ISSNL_READ_TIMEOUT:5m}
  finder:
    # the name finder of FIND_NAMES: a finder service at url, else the in-process pipeline built from the COL dictionary
    # (eval build-dictionary output; also used to de-hyphenate TEI text), else none and FIND_NAMES tasks wait
    url: ${NAMETRACKER_FINDER_URL:}
    dictionary: ${FINDER_DICTIONARY:}
    # directory of dictionary-<xrKey>.bin files: BUILD_DICTIONARY (after an XR switch) builds the new one there from
    # xr-zip-url and the in-process finder reloads it; blank = no per-release dictionaries
    dictionary-dir: ${NAMETRACKER_DICTIONARY_DIR:}
    xr-zip-url: ${NAMETRACKER_XR_ZIP_URL:https://download.checklistbank.org/col/xr_latest_coldp.zip}
    # a zip download that delivers no byte for this long is broken off: BUILD_DICTIONARY is deferred as an outage
    xr-zip-read-timeout: ${NAMETRACKER_XR_ZIP_READ_TIMEOUT:5m}
    gnfinder-url: ${GNFINDER_URL:}
    # optional file with a JSON object of pipeline overrides
    config: ${FINDER_CONFIG:}
  blobs:
    dir: ${NAMETRACKER_BLOBS_DIR:./data/blobs}
  content:
    # transient store of full text that may not be kept, until FIND_NAMES has run; purged after spool-max-age
    spool-dir: ${NAMETRACKER_SPOOL_DIR:./data/spool}
    spool-max-age: ${NAMETRACKER_SPOOL_MAX_AGE:14d}
    open-licences: ${NAMETRACKER_CONTENT_OPEN_LICENCES:cc-by,cc-by-sa,cc0,public-domain}
  crossref:
    base-url: ${NAMETRACKER_CROSSREF_BASE_URL:https://api.crossref.org}
    # blank means the public pool
    mailto: ${CROSSREF_MAILTO:}
  clb:
    # ChecklistBank API: the pinned XR (dataset 3LXR) and name matching, not throttled
    base-url: ${NAMETRACKER_CLB_BASE_URL:https://api.checklistbank.org}
    # parallel CLB match calls of one XR_PREMATCH task
    match-parallelism: ${NAMETRACKER_CLB_MATCH_PARALLELISM:8}
    # a local CLB release bundle (http://localhost:18100): serves all match calls and the N1 probe, and tells the release
    # key to pin; not rate limited. Empty means base-url.
    match-base-url: ${NAMETRACKER_CLB_MATCH_BASE_URL:}
  xr:
    # the XR switch gate: a new release that loses more than this share of the keys matched in the current one
    # (no match, or CLB cannot match the name) is REFUSED instead of becoming current
    max-lost-share: 0.05
  hits:
    # alert window of a follow: papers published at most window-days ago (inclusive), at most future-days ahead
    window-days: ${NAMETRACKER_HIT_WINDOW_DAYS:90}
    future-days: 7
  salience:
    # work_name salience (see Salience): weights of the title, abstract, act, heading, share-of-body-mentions and
    # repeat terms, the penalty for ubiquitous names, and the score from which a name is a main subject
    title: 0.40
    abstract: 0.20
    act: 0.35
    heading: 0.15
    share: 0.25
    repeat: 0.15
    ubiquity: 0.50
    ubiquity-full-share: 0.02
    threshold: 0.35
