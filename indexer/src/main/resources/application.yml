spring:
  application:
    name: garrulus-indexer
  datasource:
    url: ${NAMETRACKER_DB_URL:jdbc:postgresql://localhost:5434/nametracker}
    username: ${NAMETRACKER_DB_USER:nametracker}
    password: ${NAMETRACKER_DB_PASSWORD:nametracker}
  config:
    # local .env (see .env.example); the second entry covers running from a module directory (spring-boot:run).
    # nametracker.dotenv replaces the list; the ITs set it to a file that never exists, so they never read a .env
    import: ${nametracker.dotenv:optional:file:.env[.properties],optional:file:../.env[.properties]}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${NAMETRACKER_INDEXER_PORT:8081}
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info

nametracker:
  indexer:
    workers: ${NAMETRACKER_INDEXER_WORKERS:8}
    poll-interval: ${NAMETRACKER_INDEXER_POLL_INTERVAL:2s}
    max-attempts: ${NAMETRACKER_INDEXER_MAX_ATTEMPTS:5}
    backoff: ${NAMETRACKER_INDEXER_BACKOFF:1m}
    # a RUNNING task whose lock is older than stale-after is requeued; the heartbeat keeps live tasks fresh
    stale-after: ${NAMETRACKER_INDEXER_STALE_AFTER:1h}
    requeue-interval: ${NAMETRACKER_INDEXER_REQUEUE_INTERVAL:10m}
    heartbeat-interval: ${NAMETRACKER_INDEXER_HEARTBEAT_INTERVAL:2m}

  stats:
    # nightly REBUILD_STATS (name ubiquity, taxon stats; LIVE priority); UTC, six fields; not behind the harvest switch
    cron: ${NAMETRACKER_STATS_CRON:0 30 4 * * *}

  harvest:
    # master switch of the scheduled harvests; off means nothing is enqueued on a schedule (handlers still run for
    # tasks enqueued by hand). Crons are UTC, six fields.
    enabled: ${NAMETRACKER_HARVEST_ENABLED:false}
    openalex-cron: ${NAMETRACKER_HARVEST_OPENALEX_CRON:0 0 2 * * *}
    sweep-cron: ${NAMETRACKER_HARVEST_SWEEP_CRON:0 0 4 * * SUN}
    crossref-cron: ${NAMETRACKER_HARVEST_CROSSREF_CRON:0 0 3 * * *}
    # a harvest or onboarding page that meets an outage (a retryable HTTP failure) is enqueued again after this delay
    outage-delay: ${NAMETRACKER_HARVEST_OUTAGE_DELAY:30m}

  openalex:
    base-url: ${NAMETRACKER_OPENALEX_BASE_URL:https://api.openalex.org}
    # from the environment or the git-ignored .env; blank means no key (keyless page paging)
    api-key: ${OPENALEX_API_KEY:}
    max-daily-usd: ${NAMETRACKER_OPENALEX_MAX_DAILY_USD:1.00}
    content:
      # content.openalex.org, GROBID TEI at $0.01 per download; needs the API key
      base-url: ${NAMETRACKER_OPENALEX_CONTENT_BASE_URL:https://content.openalex.org}
      enabled: ${NAMETRACKER_OPENALEX_CONTENT_ENABLED:true}
      reserve-usd: ${NAMETRACKER_OPENALEX_CONTENT_RESERVE_USD:0.30}
  # per-host request spacing overrides: nametracker.http.min-interval.<host>=<duration>, e.g. api.crossref.org=500ms
  seed:
    core-min-works: ${NAMETRACKER_SEED_CORE_MIN_WORKS:20}
    core-min-share: ${NAMETRACKER_SEED_CORE_MIN_SHARE:0.30}
    broad-min-works: ${NAMETRACKER_SEED_BROAD_MIN_WORKS:30}
    broad-min-share: ${NAMETRACKER_SEED_BROAD_MIN_SHARE:0.50}
    candidate-min-works: ${NAMETRACKER_SEED_CANDIDATE_MIN_WORKS:10}
  finder:
    # the name finder of FIND_NAMES: a finder service at url, else the in-process pipeline built from the COL dictionary
    # (eval build-dictionary output; also used to de-hyphenate TEI text), else none and FIND_NAMES tasks wait
    url: ${NAMETRACKER_FINDER_URL:}
    dictionary: ${FINDER_DICTIONARY:}
    gnfinder-url: ${GNFINDER_URL:}
    # optional file with a JSON object of pipeline overrides
    config: ${FINDER_CONFIG:}
  blobs:
    dir: ${NAMETRACKER_BLOBS_DIR:./data/blobs}
  content:
    # transient store of full text that may not be kept, until FIND_NAMES has run; purged after spool-max-age
    spool-dir: ${NAMETRACKER_SPOOL_DIR:./data/spool}
    spool-max-age: ${NAMETRACKER_SPOOL_MAX_AGE:14d}
    open-licences: ${NAMETRACKER_CONTENT_OPEN_LICENCES:cc-by,cc-by-sa,cc0,public-domain}
  crossref:
    base-url: ${NAMETRACKER_CROSSREF_BASE_URL:https://api.crossref.org}
    # blank means the public pool
    mailto: ${CROSSREF_MAILTO:}
  clb:
    # ChecklistBank API: the pinned XR (dataset 3LXR) and name matching, not throttled
    base-url: ${NAMETRACKER_CLB_BASE_URL:https://api.checklistbank.org}
    # parallel CLB match calls of one XR_PREMATCH task
    match-parallelism: ${NAMETRACKER_CLB_MATCH_PARALLELISM:8}
    # a local CLB release bundle (http://localhost:18100): serves all match calls and the N1 probe, and tells the release
    # key to pin; not rate limited. Empty means base-url.
    match-base-url: ${NAMETRACKER_CLB_MATCH_BASE_URL:}
  hits:
    # alert window of a follow: papers published at most window-days ago (inclusive), at most future-days ahead
    window-days: ${NAMETRACKER_HIT_WINDOW_DAYS:90}
    future-days: 7
  salience:
    # work_name salience (see Salience): weights of the title, abstract, act, heading, share-of-body-mentions and
    # repeat terms, the penalty for ubiquitous names, and the score from which a name is a main subject
    title: 0.40
    abstract: 0.20
    act: 0.35
    heading: 0.15
    share: 0.25
    repeat: 0.15
    ubiquity: 0.50
    ubiquity-full-share: 0.02
    threshold: 0.35
